# SonarQube / SonarCloud static analysis configuration (SonarSource, n.d.).
# The CI pipeline ("static-analysis" job) runs the scanner after the backend and frontend jobs have
# produced their lcov coverage reports. Each application is a module so the relative paths inside its
# lcov.info file resolve correctly.
# SonarCloud keys are unique across SonarCloud. If this one is refused, set the GitHub repository variable
# SONAR_PROJECT_KEY to the key SonarCloud generates; the pipeline passes it as -Dsonar.projectKey and it wins over this line.
sonar.projectKey=hustlehub-plus
sonar.projectName=HustleHub+
sonar.sourceEncoding=UTF-8

sonar.modules=backend,frontend

backend.sonar.projectBaseDir=backend
backend.sonar.sources=src
backend.sonar.tests=tests
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.exclusions=src/tests/**
frontend.sonar.tests=src/tests
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Never analyse generated output or dependencies.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/test-results/**,**/certs/**
