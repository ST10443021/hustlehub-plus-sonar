# TLS-terminating nginx for the containerised frontend. The certificate pair is the
# locally trusted one from "npm run gen-cert" (mounted read-only by docker-compose.yml),
# so the browser shows a padlock rather than "Not secure" (Mozilla, 2026a; nginx, n.d.).

# Plain HTTP only redirects to HTTPS; it never serves the application.
server {
    listen 80;
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Document-level security headers (Mozilla, 2026b; OWASP, 2021).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback - React Router handles client-side routes, so any
        # unmatched path still serves index.html rather than a bare nginx 404.
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass https://backend:5443/api/;
        # The backend certificate lists "backend" in its SAN and is signed by the local CA,
        # so the proxy can verify it instead of skipping verification (Saint-Andre and Salz, 2023).
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/rootCA.pem;
        proxy_ssl_name backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
