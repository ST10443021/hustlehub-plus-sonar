# HustleHub+ CI/CD pipeline (GitHub, n.d.a).
#
# On every push and pull request it installs dependencies, lints (static analysis), runs the backend
# and frontend tests, audits dependencies, builds BOTH Docker images, starts the whole
# stack with Docker Compose, runs the Postman collection through Newman against the running
# containers, scans the images with Trivy, and checks that the key events reached the logs.
# Any failing step fails the job, and the final "pipeline-passed" job fails if any job failed, so a
# red result blocks merging when branch protection requires it (IIE, 2026c; OWASP, 2024f).
# The private Classroom repository has no enabled GitHub Code Security entitlement.
# Required source analysis is provided by blocking ESLint + security-rule steps below.
# Trivy repository/image checks, npm audits, tests and final failure gating remain active.
# CodeQL is not claimed as passed; see docs/part3/CI_REPAIR.md.
name: CI

on:
  push:
    branches: [main, master, blake, hamza, connor, muzzi]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend - lint, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis (ESLint + security rules, zero warnings allowed)
        run: |
          mkdir -p test-results
          npm run lint:report
      - name: Unit and integration tests (Jest + Supertest)
        run: npm test 2>&1 | tee test-results/backend-tests.txt
      - name: Dependency audit - production packages, fail on high or critical
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee test-results/npm-audit-production.txt
      - name: Full dependency audit report (informational, includes dev tools)
        if: always()
        run: npm audit --json > test-results/npm-audit-full.json || true
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-static-analysis
          path: backend/test-results/
          if-no-files-found: warn

  frontend:
    name: Frontend - lint, tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis (ESLint + React + security rules, zero warnings allowed)
        run: |
          mkdir -p test-results
          npm run lint:report
      - name: Component tests (Vitest + React Testing Library)
        run: npm test 2>&1 | tee test-results/frontend-tests.txt
      - name: Production build
        run: npm run build 2>&1 | tee test-results/frontend-build.txt
      - name: Dependency audit - production packages, fail on high or critical
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee test-results/npm-audit-production.txt
      - name: Full dependency audit report (informational)
        if: always()
        run: npm audit --json > test-results/npm-audit-full.json || true
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-analysis
          path: frontend/test-results/
          if-no-files-found: warn

  repo-scan:
    name: Trivy - secrets, vulnerabilities and misconfiguration in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the repository (fails on HIGH or CRITICAL findings that have a fix)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs node_modules --exit-code 1 --format table . | tee reports/trivy-repo.txt
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-repository-report
          path: reports/
          if-no-files-found: warn

  stack:
    name: Docker Compose stack - build, run, API tests, image scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_EMAIL: ci-admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Create a throw-away TLS certificate and secrets for this run
        run: |
          node backend/scripts/generateCert.js
          chmod 644 backend/certs/*.pem
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "MONGO_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          echo "ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)-Aa1" >> "$GITHUB_ENV"

      - name: Build both images (backend and frontend)
        run: docker compose build --pull

      - name: Start the stack and wait for every service to be healthy
        run: docker compose up -d --wait --wait-timeout 180

      - name: Check that all three containers are running
        run: |
          docker compose ps
          for service in mongo backend frontend; do
            running=$(docker compose ps --status running -q "$service" | wc -l)
            [ "$running" -eq 1 ] || { echo "$service is not running"; docker compose logs --no-color "$service"; exit 1; }
          done

      - name: Smoke test - web app, API and security headers through nginx
        run: |
          # Output goes to files first: "curl | grep -q" can fail with a broken pipe under pipefail.
          curl -fsk https://localhost:8443/ -o page.html
          grep 'id="root"' page.html > /dev/null
          curl -fsk https://localhost:8443/api/health -o health.json
          grep 'running' health.json > /dev/null
          curl -sk -D page.headers -o /dev/null https://localhost:8443/
          grep -i 'content-security-policy' page.headers > /dev/null
          curl -sk -D api.headers -o /dev/null https://localhost:8443/api/health
          grep -i 'x-request-id' api.headers > /dev/null

      - name: Create the administrator account
        run: |
          docker compose exec -T -e ADMIN_EMAIL="$ADMIN_EMAIL" -e ADMIN_PASSWORD="$ADMIN_PASSWORD" backend node scripts/seedAdmin.js

      - name: API tests - Postman collection with Newman against the running containers
        working-directory: backend
        run: |
          npm ci
          NEWMAN_BASE_URL=https://localhost:8443 npm run test:api

      - name: Logging check - key events must appear in the container log
        run: |
          docker compose logs --no-color backend > backend-container.log
          for event in user_registered user_login login_failed account_locked booking_created transaction_created access_denied rate_limit_exceeded user_logout; do
            grep -q "\"event\":\"$event\"" backend-container.log || { echo "Missing log event: $event"; exit 1; }
          done
          echo "All expected events were logged."
          ! grep -Eq 'Passw0rd123|"password"|\$2[aby]\$' backend-container.log || { echo "Sensitive data found in the log"; exit 1; }

      # Newman deliberately exhausts rate limits. Restart only the disposable CI API,
      # keeping its MongoDB data/volume, so browser checks receive a fresh IP budget.
      - name: Reset API rate limits before browser integration tests
        run: |
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 180

      - name: Install browser test dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser integration - real frontend, HTTPS API and MongoDB
        working-directory: frontend
        env:
          E2E_ALLOW_TEST_DATA: '1'
          E2E_BASE_URL: https://localhost:8443
        run: npm run test:e2e

      - name: Keep browser integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-integration
          path: |
            frontend/playwright-report/
            frontend/test-results/browser/
            frontend/test-results/browser-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Image scan - Trivy (fails on CRITICAL vulnerabilities that have a fix)
        run: |
          mkdir -p reports
          for image in hustlehub/backend:local hustlehub/frontend:local; do
            name=$(echo "$image" | tr '/:' '__')
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table "$image" | tee "reports/trivy-$name-high.txt"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

      - name: Keep evidence
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps > evidence/compose-ps.txt || true
          docker compose logs --no-color > evidence/compose-logs.txt || true
          cp backend/test-results/* evidence/ 2>/dev/null || true
          cp backend-container.log evidence/ 2>/dev/null || true
          cp reports/* evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-evidence
          path: evidence/
          if-no-files-found: warn

      - name: Stop the stack and remove its data
        if: always()
        run: docker compose down -v

  pipeline-passed:
    name: Pipeline result
    if: always()
    needs: [backend, frontend, repo-scan, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more jobs did not succeed."
            exit 1
          fi
