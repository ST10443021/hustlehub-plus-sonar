# HustleHub+ CI/CD pipeline (GitHub, n.d.d; OWASP, 2024i).
#
# Runs automatically on every push, every pull request and on demand. The final job fails the whole
# workflow if ANY required job failed or was cancelled, so a red tick always means "something is
# wrong" and a green tick means "every check below passed":
#
#   backend         install, ESLint (+security plugin), npm audit, Jest/Supertest with coverage
#   frontend        install, ESLint, npm audit, Vitest with coverage, production build
#   static-analysis SonarQube / SonarCloud analysis with a quality gate. It FAILS the pipeline when
#                   SONAR_TOKEN or SONAR_ORGANIZATION is missing, so a green run can never mean "no static
#                   analysis happened" (only Dependabot and fork pull requests, which GitHub gives no secrets, skip it)
#   codeql          GitHub CodeQL security queries (public repositories only)
#   repo-scan       Gitleaks (secrets in git history) and Trivy (vulnerable packages, secrets, Dockerfile problems)
#   stack           docker compose build and start, Newman API tests, Playwright browser tests, Trivy image scans
#   pipeline-passed single required status check
#
# No credentials are stored in this file. Every secret the stack needs (JWT secret, database password,
# admin password) is generated fresh for each run and masked in the log (GitHub, n.d.a).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend - lint, audit, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis - ESLint with eslint-plugin-security (fails on any warning)
        run: npm run lint
      - name: Dependency audit - production packages (fails on HIGH or CRITICAL)
        run: npm run audit
      - name: Unit and integration tests with coverage (Jest and Supertest)
        run: npm run test:coverage
      - name: Save reports
        if: always()
        run: |
          mkdir -p test-results
          npm run lint:report || true
          npm audit --json > test-results/npm-audit-full.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/coverage/lcov.info
            backend/test-results/
          if-no-files-found: warn

  frontend:
    name: Frontend - lint, audit, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis - ESLint with react, react-hooks and security rules (fails on any warning)
        run: npm run lint
      - name: Dependency audit - production packages (fails on HIGH or CRITICAL)
        run: npm run audit
      - name: Component tests with coverage (Vitest and React Testing Library)
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Save reports
        if: always()
        run: |
          mkdir -p test-results
          npm run lint:report || true
          npm audit --json > test-results/npm-audit-full.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: |
            frontend/coverage/lcov.info
            frontend/test-results/
          if-no-files-found: warn

  static-analysis:
    name: Static analysis - SonarQube / SonarCloud
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      # Passed through the environment, never pasted into the script text, so a crafted name cannot inject commands (OWASP, 2024i).
      ACTOR: ${{ github.actor }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history to attribute issues correctly
      - uses: actions/download-artifact@v4
        with:
          name: backend-reports
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-reports
          path: frontend
      # Static analysis is a required part of this pipeline, so a missing token is an ERROR, not a warning.
      # The only exceptions are runs GitHub cannot give secrets to: Dependabot and fork pull requests.
      - name: Require the Sonar configuration (fails the pipeline if it is missing)
        id: sonar-config
        shell: bash
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ] || [ "$FROM_FORK" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sonar skipped: GitHub does not give repository secrets to Dependabot or fork pull requests. It runs on the push to the default branch."
            exit 0
          fi
          missing=""
          [ -z "$SONAR_TOKEN" ] && missing="$missing the secret SONAR_TOKEN"
          [ -z "$SONAR_ORGANIZATION" ] && missing="$missing the variable SONAR_ORGANIZATION"
          if [ -n "$missing" ]; then
            echo "::error::Static analysis cannot run because this repository is missing:$missing. Add them under Settings > Secrets and variables > Actions (see README section 12)."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: SonarQube / SonarCloud scan with quality gate
        if: ${{ steps.sonar-config.outputs.run == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          # SonarCloud project keys are unique across all of SonarCloud, so "hustlehub-plus" may already be taken.
          # Set the repository variable SONAR_PROJECT_KEY to the key SonarCloud generated; it overrides sonar-project.properties.
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  codeql:
    name: Static analysis - CodeQL
    # CodeQL code scanning is free for public repositories. Private repositories need GitHub Advanced Security,
    # so the job is skipped there and SonarQube/ESLint/Trivy provide the static analysis (GitHub, n.d.c).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # Gitleaks searches every commit for committed secrets (Gitleaks, n.d.). Trivy checks dependencies,
  # secrets and Dockerfile settings (Aqua Security, n.d.). Both exit non-zero on findings, which fails the job.
  repo-scan:
    name: Security scan - secrets and vulnerabilities (Gitleaks, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan of the full git history (Gitleaks)
        shell: bash # explicit bash enables "pipefail", so a failing scanner can never be hidden by a pipe
        run: |
          mkdir -p evidence
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.21.2 detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1 --report-format json --report-path /repo/evidence/gitleaks-report.json
      - name: Repository scan - vulnerable packages, committed secrets, Dockerfile misconfiguration (Trivy)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.2 fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs '**/node_modules' --skip-dirs '**/dist' --exit-code 1 --format table /src | tee evidence/trivy-repo.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-scan-reports
          path: evidence/
          if-no-files-found: warn

  stack:
    name: Docker stack - Compose, Newman API tests, Playwright browser tests, image scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create throw-away certificates and secrets for this run only
        shell: bash
        run: |
          mkdir -p evidence
          # Local CA + localhost certificate (same script developers use). The certificate files must be
          # readable by the non-root users inside the containers; they are disposable test files.
          node backend/scripts/generateCert.js
          chmod 644 backend/certs/*.pem
          JWT_SECRET="$(openssl rand -hex 32)"
          MONGO_PASSWORD="$(openssl rand -hex 24)"
          ADMIN_PASSWORD="Aa1-$(openssl rand -hex 12)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$MONGO_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          {
            echo "JWT_SECRET=$JWT_SECRET"
            echo "MONGO_PASSWORD=$MONGO_PASSWORD"
            echo "LOCKOUT_MAX_ATTEMPTS=5"
            echo "LOCKOUT_MINUTES=15"
          } > .env
          {
            echo "ADMIN_EMAIL=ci-admin@example.com"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build and start the stack (MongoDB, backend, frontend) and wait until every container is healthy
        shell: bash
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Proof - all three containers are running and healthy
        shell: bash
        run: docker compose ps | tee evidence/docker-compose-ps.txt

      - name: Proof - HTTPS answers through nginx with a verified certificate chain
        shell: bash
        run: |
          curl --fail --silent --show-error --cacert backend/certs/rootCA.pem https://localhost:8443/api/health | tee evidence/https-health.json
          echo

      - name: Create the administrator account used by the admin API checks
        shell: bash
        run: docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD backend node scripts/seedAdmin.js

      - name: API tests - Newman runs the Postman collection against the running stack
        shell: bash
        working-directory: backend
        env:
          NEWMAN_BASE_URL: https://localhost:8443
        run: |
          npm ci
          npm run test:api 2>&1 | tee ../evidence/newman-run.txt

      # The Newman collection deliberately exhausts the sign-in and booking rate limits. Restarting the
      # API clears its in-memory counters so the browser tests start from a clean slate.
      - name: Reset rate-limit counters before the browser tests
        shell: bash
        run: docker compose restart backend && docker compose up -d --wait --wait-timeout 120

      # Playwright opens the real pages in Chromium, so this covers the React app, nginx and the API together
      # (Playwright, n.d.).
      - name: Browser tests - Playwright drives the real application in Chromium
        shell: bash
        working-directory: e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          E2E_ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          CI: 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Scan both container images with Trivy (fails on fixable CRITICAL findings)
        shell: bash
        run: |
          for image in hustlehub-backend hustlehub-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table "$image" > "evidence/trivy-$image-high.txt"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "$image" | tee "evidence/trivy-$image-critical.txt"
          done

      - name: Collect logging evidence and container logs
        if: always()
        shell: bash
        run: |
          docker compose ps > evidence/docker-compose-ps-final.txt || true
          docker compose exec -T backend cat logs/events.log > evidence/events.log || true
          docker compose logs --no-color --tail=300 > evidence/container-logs.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-evidence
          path: |
            evidence/
            backend/test-results/
            e2e/test-results/
            e2e/playwright-report/
            e2e/evidence/
          if-no-files-found: warn

      - name: Stop and remove the stack
        if: always()
        shell: bash
        run: docker compose down -v

  pipeline-passed:
    name: Pipeline passed
    if: always()
    needs: [backend, frontend, static-analysis, codeql, repo-scan, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded (only CodeQL on a private repository may be skipped)
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::At least one required pipeline job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs succeeded."
